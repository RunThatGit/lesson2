name: Node setup example 
on: workflow_dispatch
jobs: 
  setup-node:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: print node js version 
        run: node -v 
